name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: vscode-extension-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: Florian-Noever/Florian-Noever/.github/workflows/vscode-extension-publish.yml@v1
    with:
      test-command: npm test
      vs-marketplace: true
      # open-vsx stays off: Open VSX refuses the extension while rvanbekkum.xliff-sync is not there
